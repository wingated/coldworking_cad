[package]
name = "coldworking-viewer"
version = "0.1.0"
edition = "2021"
description = "Real-time spectral path tracer for coldworking-cad .render.json scenes"
license = "MIT"

[dependencies]
wgpu = "29"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = true
